<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- C: minimal ball & stick, diagonal -->
  <g transform="translate(40,40)">
    <!-- thick bond -->
    <line x1="-16" y1="12" x2="16" y2="-12" stroke="#0D9488" stroke-width="7" stroke-linecap="round"/>
    <!-- back atom -->
    <circle cx="-18" cy="14" r="11" fill="#14B8A6"/>
    <!-- front atom -->
    <circle cx="18" cy="-14" r="14" fill="#0F766E"/>
    <circle cx="18" cy="-14" r="14" fill="url(#cGloss)"/>
    <!-- small accent atom -->
    <circle cx="22" cy="12" r="6" fill="#5EEAD4"/>
    <line x1="12" y1="-6" x2="20" y2="8" stroke="#0D9488" stroke-width="3.5" stroke-linecap="round"/>
    <defs>
      <radialGradient id="cGloss" cx="0.35" cy="0.3" r="0.65">
        <stop offset="0%" stop-color="#fff" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </g>
  <!-- wordmark: monospace-ish tech feel -->
  <text x="88" y="50" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="30" font-weight="700" letter-spacing="-1" fill="#0F172A">fast</text>
  <text x="152" y="50" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="30" font-weight="400" letter-spacing="-1" fill="#0D9488">·mol</text>
</svg>
