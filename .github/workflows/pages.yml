name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The Studio is a local writing tool; the published site must not carry it.
      - run: test ! -e dist/studio && ! grep -q '/studio' dist/sitemap-0.xml
      # The documentation sites under /doc/ (Multiwfn, Gaussian, ORCA…) are built in
      # their own repos, which push them to the doc-sites branch; they go out with the blog.
      - uses: actions/checkout@v4
        with:
          ref: doc-sites
          path: doc-sites
      - run: test ! -e dist/doc && cp -R doc-sites/doc dist/doc && test -f dist/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
